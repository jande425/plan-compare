# Nightly plan refresh. Inactive until this folder is pushed to a GitHub repository.
# Fails (and GitHub emails you) if any retailer's plan list or plan detail could not be downloaded,
# so stale data never goes out silently.
name: Refresh plans
on:
  schedule:
    - cron: '30 17 * * *'      # 03:30 Brisbane time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Download current plans (Energex area)
        run: python tools/fetch_plans.py all --distributor Energex
      - name: Fail on any download error
        run: |
          python - <<'PY'
          import json, sys
          log = json.load(open('tools/cache/fetch-log.json'))
          bad = log['retailer_failures'] + log['detail_failures']
          if bad:
              print('Download failures:', bad); sys.exit(1)
          PY
      - name: Rebuild plans.json
        run: python tools/build_plans.py tools/cache/details --current tools/cache/plan_lists --today "$(date -u +%F)" --label "South East Queensland (Energex)"
      - name: Tests
        run: node --test tests/engine.test.mjs tests/battery.test.mjs tests/bills.test.mjs
      - name: Commit if changed
        run: |
          git config user.name "plan-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/plans.json
          git diff --cached --quiet || git commit -m "Refresh plans $(date -u +%F)" && git push
